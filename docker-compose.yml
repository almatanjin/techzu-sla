# Local development stack. Docker is the only host prerequisite.
# All credentials below are local-only placeholders.
name: techzu-sla

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${HOST_UID:-1000}
      GID: ${HOST_GID:-1000}
  image: techzu-sla-php:dev
  volumes:
    - ./backend:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *php
    command: php-fpm

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *php
    # queue:listen reloads the code for every job, so edits apply without a restart.
    command: php artisan queue:listen --tries=3 --timeout=60

  scheduler:
    <<: *php
    command: php artisan schedule:work

  mysql:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: techzu_sla
      MYSQL_USER: techzu
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mysql-test:
    image: mysql:9.7
    environment:
      MYSQL_DATABASE: testing
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_ROOT_PASSWORD: root
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Linux (musl) native binaries stay in the container, separate from the host.
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    restart: unless-stopped

volumes:
  mysql-data:
  frontend-node-modules:
