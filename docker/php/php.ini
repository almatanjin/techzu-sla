; Development PHP settings.
memory_limit = 512M
upload_max_filesize = 11M
post_max_size = 60M
max_file_uploads = 10
max_execution_time = 60
expose_php = Off

; Opcache stays on for speed, but re-checks file timestamps on every request
; so code edits in the bind mount take effect immediately.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
